<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>KAMAI — O Mundo Além do Finito</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0712; --bg2:#0f0a1a; --panel:#161022; --panel2:#1b1428;
  --border:#2c2140; --border-soft:#221a33;
  --crimson:#a41e34; --crimson-bright:#e0293f;
  --purple:#7c3aed; --purple-bright:#a06bff;
  --gold:#caa968; --text:#ece7f5; --text-dim:#948da8; --text-faint:#645d78;
  --ok:#3ecf8e; --warn:#e0a72f; --radius:14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;overflow-x:hidden;}
body{background:radial-gradient(ellipse at 20% 0%, #1a0f22 0%, var(--bg) 45%), var(--bg);
  color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;}
::selection{background:var(--purple);color:#fff;}
input,textarea,select{font-family:inherit;color:var(--text);background:var(--bg2);
  border:1px solid var(--border);border-radius:8px;padding:6px 9px;font-size:13px;}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--purple-bright);}
input[type=number]{width:64px;}
button{font-family:inherit;cursor:pointer;}
h1,h2,h3{font-family:'Noto Serif JP',serif;margin:0;}
.scrim{position:fixed;inset:0;pointer-events:none;background:
  radial-gradient(circle at 85% 90%, rgba(164,30,52,.10), transparent 40%),
  radial-gradient(circle at 10% 100%, rgba(124,58,237,.10), transparent 45%); z-index:0;}

/* ---------- SPLASH / AUTH SCREENS ---------- */
.splash{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px 18px;position:relative;z-index:2;}
.splash-brand{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:28px;}
.splash-brand .torii{width:44px;height:44px;}
.splash-brand h1{font-size:26px;letter-spacing:1px;background:linear-gradient(90deg,var(--gold),var(--crimson-bright));
  -webkit-background-clip:text;background-clip:text;color:transparent;}
.splash-brand p{font-size:11.5px;color:var(--text-faint);letter-spacing:.5px;text-align:center;}
.splash-card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--border);
  border-radius:16px;padding:20px;width:100%;max-width:380px;}
.splash-card h2{font-size:14px;color:var(--gold);margin-bottom:4px;}
.splash-card .sub{font-size:11.5px;color:var(--text-faint);margin-bottom:16px;line-height:1.4;}
.big-btn{width:100%;padding:12px;border-radius:10px;border:none;font-weight:800;font-size:13px;margin-bottom:10px;
  background:linear-gradient(90deg,var(--crimson),var(--purple));color:#fff;letter-spacing:.3px;}
.ghost-btn{width:100%;padding:11px;border-radius:10px;border:1px solid var(--border);background:none;color:var(--text-dim);font-weight:700;font-size:12.5px;margin-bottom:10px;}
.splash-field{margin-bottom:12px;}
.splash-field label{display:block;font-size:10.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;font-weight:700;}
.splash-field input{width:100%;padding:10px;font-size:14px;text-align:center;letter-spacing:2px;}
.pin-boxes{display:flex;gap:8px;justify-content:center;margin-bottom:8px;}
.pin-boxes input{width:44px;height:52px;text-align:center;font-size:22px;font-weight:800;padding:0;}
.splash-error{color:var(--crimson-bright);font-size:11.5px;text-align:center;margin-bottom:10px;min-height:14px;font-weight:700;}
.reveal-box{background:var(--bg2);border:1px dashed var(--gold);border-radius:10px;padding:14px;text-align:center;margin-bottom:14px;}
.reveal-box .lk{font-size:10px;color:var(--text-faint);margin-bottom:4px;text-transform:uppercase;letter-spacing:.6px;}
.reveal-box .lv{font-family:monospace;font-size:12px;color:var(--gold);word-break:break-all;margin-bottom:10px;}
.reveal-box .pv{font-size:30px;font-weight:900;letter-spacing:6px;color:var(--text);margin-bottom:2px;}
.copy-btn{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:6px 12px;font-size:11px;font-weight:700;}
.warn-box{background:rgba(224,167,47,.1);border:1px solid var(--warn);border-radius:10px;padding:10px 12px;font-size:11px;color:var(--warn);margin-bottom:14px;line-height:1.4;}
.known-list{margin-bottom:6px;}
.known-item{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:9px 10px;margin-bottom:7px;}
.known-item .av{width:32px;height:32px;border-radius:50%;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.known-item .nm{flex:1;font-size:12.5px;font-weight:700;}
.known-item .go{background:var(--panel2);border:1px solid var(--border);color:var(--gold);border-radius:7px;padding:5px 10px;font-size:10.5px;font-weight:700;}
.divider-text{display:flex;align-items:center;gap:10px;color:var(--text-faint);font-size:10px;margin:14px 0;text-transform:uppercase;letter-spacing:.6px;}
.divider-text::before,.divider-text::after{content:"";flex:1;height:1px;background:var(--border);}
.remember-row{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--text-dim);margin-bottom:14px;}

/* ---------- TOP BAR ---------- */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:10px 14px;
  background:linear-gradient(180deg, rgba(15,10,26,.97), rgba(15,10,26,.9));border-bottom:1px solid var(--border-soft);backdrop-filter:blur(8px);}
.topbar .brand{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.torii{width:22px;height:22px;flex-shrink:0;}
.brand-text{font-family:'Noto Serif JP',serif;font-weight:900;font-size:15px;letter-spacing:.5px;
  background:linear-gradient(90deg,var(--gold),var(--crimson-bright));-webkit-background-clip:text;background-clip:text;color:transparent;}
.topbar .glance{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:11px;color:var(--text-dim);overflow:hidden;white-space:nowrap;}
.glance b{color:var(--text);font-weight:700;}
.glance .hp-dot{color:var(--crimson-bright);} .glance .sn-dot{color:var(--purple-bright);}
.menu-btn{background:none;border:1px solid var(--border);border-radius:8px;color:var(--text);width:34px;height:34px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--text-faint);flex-shrink:0;}
.sync-dot.ok{background:var(--ok);} .sync-dot.busy{background:var(--warn);}

/* ---------- LAYOUT ---------- */
.app{display:flex;position:relative;z-index:1;min-height:100vh;}
.sidebar{width:76px;flex-shrink:0;background:linear-gradient(180deg,var(--panel),var(--bg2));
  border-right:1px solid var(--border-soft);padding:10px 0;display:flex;flex-direction:column;gap:2px;
  position:sticky;top:53px;height:calc(100vh - 53px);overflow-y:auto;transition:transform .25s ease;}
.side-btn{background:none;border:none;color:var(--text-dim);display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:9px 2px;font-size:9.5px;font-weight:600;letter-spacing:.3px;border-left:2px solid transparent;text-align:center;}
.side-btn svg{width:18px;height:18px;}
.side-btn.active{color:var(--gold);border-left-color:var(--crimson-bright);background:rgba(164,30,52,.08);}
.main{flex:1;min-width:0;padding:14px 12px 90px;}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;margin-bottom:14px;border-bottom:1px solid var(--border-soft);scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab-chip{flex-shrink:0;background:var(--panel);border:1px solid var(--border);color:var(--text-dim);
  padding:7px 13px;border-radius:20px;font-size:11.5px;font-weight:700;letter-spacing:.4px;white-space:nowrap;}
.tab-chip.active{background:linear-gradient(90deg,var(--crimson),var(--purple));color:#fff;border-color:transparent;}
.section{animation:fadein .2s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
.card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--border);
  border-radius:var(--radius);padding:14px;margin-bottom:12px;position:relative;overflow:hidden;}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--crimson-bright),transparent);opacity:.5;}
.card h2{font-size:12px;color:var(--gold);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;font-family:'Inter',sans-serif;font-weight:800;}
.card h2 .kanji{font-family:'Noto Serif JP',serif;color:var(--text-faint);margin-right:6px;}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.field{display:flex;flex-direction:column;gap:3px;flex:1;min-width:90px;}
.field label{font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.5px;font-weight:700;}
.field input, .field select{width:100%;}

.profile-top{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px;}
.portrait-wrap{position:relative;flex-shrink:0;}
.portrait{width:78px;height:78px;border-radius:50%;object-fit:cover;border:2px solid var(--crimson-bright);
  background:radial-gradient(circle,var(--panel2),var(--bg2));display:flex;align-items:center;justify-content:center;color:var(--text-faint);font-size:26px;}
.portrait-edit{position:absolute;bottom:-2px;right:-2px;width:22px;height:22px;border-radius:50%;background:var(--purple);
  border:2px solid var(--bg);display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;}
.name-block{flex:1;min-width:0;}
.name-input{font-family:'Noto Serif JP',serif;font-weight:700;font-size:19px;background:transparent;border:none;
  padding:0;width:100%;color:var(--text);border-bottom:1px dashed transparent;}
.name-input:focus{border-bottom:1px dashed var(--purple-bright);}
.title-input{font-size:12px;color:var(--text-dim);background:transparent;border:none;padding:0;width:100%;margin-top:2px;}
.clan-tag{display:inline-flex;align-items:center;gap:4px;margin-top:6px;background:rgba(124,58,237,.12);
  border:1px solid rgba(124,58,237,.35);border-radius:20px;padding:3px 9px;font-size:10.5px;color:var(--purple-bright);font-weight:700;}
.clan-tag input{background:none;border:none;color:var(--purple-bright);font-weight:700;font-size:10.5px;padding:0;width:auto;min-width:60px;}
.lvl-row{display:flex;align-items:center;gap:10px;margin-top:4px;}
.lvl-badge{background:linear-gradient(135deg,var(--crimson),var(--purple));border-radius:8px;padding:4px 10px;text-align:center;flex-shrink:0;}
.lvl-badge .num{font-family:'Noto Serif JP',serif;font-weight:900;font-size:17px;line-height:1;}
.lvl-badge .lbl{font-size:8px;letter-spacing:1px;opacity:.85;}
.xp-wrap{flex:1;min-width:0;}
.xp-bar-bg{height:9px;background:var(--bg2);border-radius:6px;overflow:hidden;border:1px solid var(--border);}
.xp-bar-fill{height:100%;background:linear-gradient(90deg,var(--purple),var(--purple-bright));border-radius:6px;transition:width .3s;}
.xp-nums{font-size:10px;color:var(--text-faint);margin-top:3px;display:flex;justify-content:space-between;}
.xp-add{display:flex;gap:4px;flex-shrink:0;}
.mini-btn{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:6px;
  width:26px;height:26px;font-size:14px;display:flex;align-items:center;justify-content:center;font-weight:700;}
.info-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 10px;}
.info-cell{display:flex;flex-direction:column;gap:2px;}
.info-cell label{font-size:9px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.4px;}
.info-cell input{padding:5px 7px;font-size:12px;}
.meter{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:9px 11px;margin-bottom:8px;}
.meter-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.meter-name{font-size:11px;font-weight:800;letter-spacing:.5px;display:flex;align-items:center;gap:5px;}
.meter-vals{display:flex;align-items:center;gap:4px;font-size:12px;}
.meter-vals input{width:42px;text-align:center;padding:3px;}
.meter-bar-bg{height:8px;border-radius:5px;background:#1a1424;overflow:hidden;}
.meter-bar-fill{height:100%;border-radius:5px;transition:width .3s;}
.hp .meter-bar-fill{background:linear-gradient(90deg,#7a1220,var(--crimson-bright));}
.sn .meter-bar-fill{background:linear-gradient(90deg,#4c2a8c,var(--purple-bright));}
.cr .meter-bar-fill{background:linear-gradient(90deg,#5c4508,var(--warn));}
.cr-tag{font-size:9px;padding:1px 7px;border-radius:10px;background:rgba(224,167,47,.15);color:var(--warn);font-weight:700;}
.attr-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.attr-item{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:9px 10px;display:flex;align-items:center;justify-content:space-between;gap:6px;min-width:0;}
.attr-left{display:flex;align-items:center;gap:8px;min-width:0;flex:1;}
.attr-ic{width:26px;height:26px;border-radius:7px;background:rgba(124,58,237,.15);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;}
.attr-label{font-size:11px;font-weight:700;color:var(--text);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.attr-label small{display:block;font-size:8.5px;color:var(--text-faint);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.attr-controls{display:flex;align-items:center;gap:5px;flex-shrink:0;}
.attr-score{width:30px;text-align:center;font-weight:800;font-size:13px;padding:3px 0;}
.attr-mod{font-size:11px;color:var(--purple-bright);font-weight:800;background:rgba(124,58,237,.15);border-radius:6px;padding:2px 6px;min-width:26px;text-align:center;}
.pool-note{font-size:10.5px;color:var(--text-faint);text-align:right;margin-top:6px;}
.skill-cat{margin-bottom:4px;}
.skill-cat-title{font-size:10px;color:var(--purple-bright);text-transform:uppercase;letter-spacing:.8px;font-weight:800;margin:12px 0 6px;}
.skill-cat-title:first-child{margin-top:0;}
.skill-row{display:flex;align-items:center;justify-content:space-between;padding:7px 4px;border-bottom:1px solid var(--border-soft);gap:6px;}
.skill-name{font-size:12.5px;font-weight:600;flex:1;min-width:0;}
.skill-name small{color:var(--text-faint);font-weight:500;display:block;font-size:9.5px;}
.skill-ctrl{display:flex;align-items:center;gap:6px;}
.skill-mod{width:28px;text-align:center;font-size:12px;font-weight:700;}
.skill-total{font-size:11px;color:var(--gold);font-weight:800;min-width:54px;text-align:right;}
.quick-combat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.qc-cell{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:10px 6px;text-align:center;}
.qc-cell .lbl{font-size:9px;color:var(--text-faint);letter-spacing:.6px;text-transform:uppercase;font-weight:700;}
.qc-cell .val{font-family:'Noto Serif JP',serif;font-size:24px;font-weight:900;margin:3px 0;color:var(--text);}
.qc-cell .brk{font-size:9px;color:var(--text-faint);}
.roll-btn{margin-top:6px;background:linear-gradient(90deg,var(--crimson),var(--purple));border:none;color:#fff;
  font-size:10px;font-weight:800;padding:5px 0;border-radius:6px;width:100%;letter-spacing:.4px;}
.roll-result{font-size:10px;color:var(--ok);margin-top:4px;min-height:12px;font-weight:700;}
.pa-row{display:flex;align-items:center;gap:10px;justify-content:center;padding:8px 0;}
.pip{width:30px;height:30px;border-radius:8px;border:2px solid var(--border);background:var(--bg2);}
.pip.filled{background:linear-gradient(135deg,var(--crimson),var(--purple));border-color:var(--purple-bright);}
.reset-turn{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:6px 12px;font-size:11px;font-weight:700;}
.cond-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
.cond-item{background:var(--bg2);border:1px solid var(--border);border-radius:9px;padding:7px 9px;display:flex;flex-direction:column;gap:4px;}
.cond-item.active{border-color:var(--crimson-bright);background:rgba(164,30,52,.12);}
.cond-top{display:flex;align-items:center;justify-content:space-between;}
.cond-name{font-size:11px;font-weight:700;}
.cond-rounds{width:36px;padding:2px 4px;font-size:10px;text-align:center;}
.pip-row{display:flex;gap:5px;flex-wrap:wrap;}
.pip-sm{width:20px;height:20px;border-radius:50%;border:2px solid var(--border);background:var(--bg2);flex-shrink:0;}
.pip-sm.filled.destiny{background:var(--gold);border-color:var(--gold);}
.pip-sm.filled.spirit{background:var(--purple-bright);border-color:var(--purple-bright);}
.pip-sm.filled.death{background:var(--crimson-bright);border-color:var(--crimson-bright);}
.item-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;}
.item-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:8px;text-align:center;position:relative;}
.item-card .ic{font-size:20px;}
.item-card .nm{font-size:10.5px;font-weight:700;margin:4px 0 2px;line-height:1.2;}
.item-card .sub{font-size:9px;color:var(--text-faint);}
.item-card .qty-ctrl{display:flex;align-items:center;justify-content:center;gap:5px;margin-top:5px;}
.item-card .qty-ctrl input{width:32px;text-align:center;padding:2px;}
.item-card .del{position:absolute;top:3px;right:4px;color:var(--text-faint);background:none;border:none;font-size:11px;}
.item-card.equipped{border-color:var(--purple-bright);}
.eq-toggle{margin-top:5px;font-size:9px;padding:2px 6px;border-radius:8px;border:1px solid var(--border);background:none;color:var(--text-dim);width:100%;}
.eq-toggle.on{background:var(--purple);color:#fff;border-color:var(--purple-bright);}
.add-item-row{display:flex;gap:6px;margin-top:10px;}
.add-item-row input{flex:1;}
.add-item-row button{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:0 12px;font-size:12px;font-weight:700;}
.weight-bar{margin-top:8px;}
.tal-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.tal-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;}
.tal-card.active{border-color:var(--purple-bright);box-shadow:0 0 0 1px var(--purple-bright) inset;background:rgba(124,58,237,.1);}
.tal-icon{font-size:20px;}
.tal-name{font-size:11.5px;font-weight:800;}
.tal-desc{font-size:9.5px;color:var(--text-faint);line-height:1.35;flex:1;}
.tal-actions{display:flex;gap:5px;}
.tal-btn{flex:1;font-size:9.5px;font-weight:700;padding:5px 0;border-radius:7px;border:1px solid var(--border);background:var(--panel2);color:var(--text-dim);}
.tal-btn.own{color:var(--gold);}
.tal-btn.active-btn{background:var(--purple);color:#fff;border-color:var(--purple-bright);}
.tal-btn:disabled{opacity:.4;}
.tal-note{font-size:10.5px;color:var(--text-faint);margin-bottom:8px;}
.class-grid{display:grid;grid-template-columns:1fr;gap:10px;}
.class-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:12px;}
.class-card.selected{border-color:var(--crimson-bright);background:rgba(164,30,52,.1);}
.class-head{display:flex;align-items:center;gap:9px;margin-bottom:6px;}
.class-ic{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--crimson),var(--purple));display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
.class-name{font-family:'Noto Serif JP',serif;font-weight:700;font-size:14px;}
.class-sub{font-size:10px;color:var(--text-faint);}
.class-desc{font-size:11.5px;color:var(--text-dim);line-height:1.45;margin-bottom:8px;}
.class-ability{background:var(--panel2);border-radius:8px;padding:8px 10px;margin-bottom:8px;}
.class-ability .an{font-size:10.5px;font-weight:800;color:var(--gold);}
.class-ability .ad{font-size:10.5px;color:var(--text-dim);margin-top:2px;line-height:1.4;}
.select-class-btn{width:100%;padding:7px 0;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-size:11.5px;font-weight:700;}
.select-class-btn.on{background:linear-gradient(90deg,var(--crimson),var(--purple));color:#fff;border:none;}

function cid(){return Math.random().toString(36).slice(2,10);}
function attrMod(score){return Math.floor((score-10)/2);}
function clamp(v,min,max){return Math.max(min,Math.min(max,v));}
function esc(s){ return (s||'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtMod(m){ return (m>=0?'+':'')+m; }

function defaultState(){

  SKILLS.forEach(cat=>cat.items.forEach(s=>skillMods[s.n]=0));

function effectiveAttrs(){
  const out = {...state.attrs};
  state.stories.filter(s=>s.active && s.attrKey).forEach(s=>{ out[s.attrKey] = (out[s.attrKey]||10) + (s.attrAmount||0); });
  return out;
}
function computedHpMax(){ if(state.hpMax!=null) return state.hpMax; const e=effectiveAttrs(); return 20 + attrMod(e.VIG)*2 + (state.level-1)*2; }
function computedSanMax(){ if(state.sanMax!=null) return state.sanMax; const e=effectiveAttrs(); return 10 + attrMod(e.ESP); }
function computedWeightMax(){ if(state.weightMaxOverride!=null) return state.weightMaxOverride; const e=effectiveAttrs(); return 10 + attrMod(e.FOR)*4; }
function corruptionLabel(v){ if(v>=10) return 'Transformado'; if(v>=8) return 'Grave'; if(v>=6) return 'Sentido'; if(v>=4) return 'Ouvindo'; if(v>=2) return 'Leve'; return 'Nenhuma'; }

/* ===================== CRYPTO / TOKENS ===================== */
async function sha256(text){
  const enc = new TextEncoder().encode(text);
  const hash = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function randomToken(len=22){
  const chars='ABCDEFGHJKMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';
  const arr=new Uint8Array(len); crypto.getRandomValues(arr);
  let s=''; for(let i=0;i<len;i++) s+=chars[arr[i]%chars.length];
  return s;
}
function randomPin(){ return String(Math.floor(1000+Math.random()*9000)); }

/* ===================== LOCAL STORAGE LAYER ===================== */
const KNOWN_KEY='kamai_known_chars_v1';
function getKnownChars(){ try{return JSON.parse(localStorage.getItem(KNOWN_KEY)||'[]');}catch(e){return [];} }
function setKnownChars(arr){ try{ localStorage.setItem(KNOWN_KEY, JSON.stringify(arr)); }catch(e){ console.warn('localStorage indisponível', e); } }
function rememberChar(token,name,pin,remember){
  const list=getKnownChars().filter(c=>c.token!==token);
  list.unshift({token,name,pin:remember?pin:null,updatedAt:Date.now()});
  setKnownChars(list.slice(0,30));
}
function touchKnownName(token,name){
  const list=getKnownChars(); const it=list.find(c=>c.token===token);
  if(it){ it.name=name; it.updatedAt=Date.now(); setKnownChars(list); }
}
function forgetChar(token){ setKnownChars(getKnownChars().filter(c=>c.token!==token)); }
function cacheKey(token){return 'kamai_cache_v1:'+token;}
function getCache(token){ try{return JSON.parse(localStorage.getItem(cacheKey(token)));}catch(e){return null;} }
function setCache(token,data){ try{localStorage.setItem(cacheKey(token), JSON.stringify(data));}catch(e){} }

/* ===================== FIRESTORE LAYER ===================== */
async function fetchCharDoc(token){
  const snap = await getDoc(doc(db,'personagens',token));
  return snap.exists() ? snap.data() : null;
}
async function createCharDoc(token, pin, charState){
  const pinHash = await sha256(pin+':'+token);
  await setDoc(doc(db,'personagens',token), { name: charState.name||'Sem nome', pinHash, data: JSON.stringify(charState), createdAt: Date.now(), updatedAt: Date.now() });
}
async function saveCharDoc(token, pin, charState){
  const pinHash = await sha256(pin+':'+token);
  await updateDoc(doc(db,'personagens',token), { name: charState.name||'Sem nome', pinHash, data: JSON.stringify(charState), updatedAt: Date.now() });
}

/* ===================== APP STATE ===================== */
let screen='loading'; // loading | landing | pin | create | reveal | app
let currentToken=null, currentPin=null, rememberDevice=true;
let pendingDocPreview=null; // {name} shown before pin unlock
let pendingCreateName='';
let revealInfo=null;
let authError='';
let state=null;
let activeTab='resumo';
let sidebarOpen = window.innerWidth > 760;
let syncStatus='idle'; // idle|busy|ok|err

const root = document.getElementById('root');

function getUrlToken(){ try{ const p=new URLSearchParams(location.search); return p.get('f'); }catch(e){ return null; } }
function setUrlToken(token){ try{ const url=new URL(location.href); if(token) url.searchParams.set('f',token); else url.searchParams.delete('f'); history.replaceState({},'',url); }catch(e){ console.warn('Não foi possível atualizar a URL (ambiente de teste local)', e); } }
function shareLink(token){ try{ const url=new URL(location.href); url.search=''; url.searchParams.set('f',token); return url.toString(); }catch(e){ return location.href.split('?')[0]+'?f='+token; } }

async function boot(){
  const t = getUrlToken();
  if(t){
    currentToken=t;
    const known = getKnownChars().find(c=>c.token===t);
    let doc_ = null;
    try{ doc_ = await fetchCharDoc(t); }catch(e){ console.error(e); }
    if(!doc_){
      const cached = getCache(t);
      if(cached){ state = cached; currentPin = known?known.pin:null; screen='app'; renderAll(); return; }
      authError='Ficha não encontrada. Verifique o link.'; screen='landing'; renderAll(); return;
    }
    pendingDocPreview = {name: doc_.name};
    if(known && known.pin){
      const hash = await sha256(known.pin+':'+t);
      if(hash===doc_.pinHash){
        currentPin=known.pin;
        state = {...defaultState(), ...JSON.parse(doc_.data)};
        setCache(t,state);
        screen='app'; renderAll(); return;
      }
    }
    screen='pin'; renderAll(); return;
  }
  screen='landing'; renderAll();
}

/* ===================== RENDER ROOT ===================== */
function renderAll(){
  if(screen==='landing') return renderLanding();
  if(screen==='pin') return renderPinScreen();
  if(screen==='create') return renderCreateScreen();
  if(screen==='reveal') return renderRevealScreen();
  if(screen==='app') return renderAppShell();
  root.innerHTML = '<div class="splash"><div class="splash-brand"><h1>KAMAI</h1></div></div>';
}

function splashHeader(){
  return `<div class="splash-brand">

    <h1>KAMAI</h1>
    <p>O Mundo Além do Finito — cada ficha é pessoal e protegida por link + PIN.</p>
  </div>`;
}

function renderLanding(){
  const known = getKnownChars();
  root.innerHTML = `<div class="splash">
    ${splashHeader()}
    <div class="splash-card">
      ${authError?`<div class="splash-error">${esc(authError)}</div>`:''}
      ${known.length? `
        <h2>Seus personagens neste dispositivo</h2>
        <div class="sub">Lembrados apenas neste navegador.</div>
        <div class="known-list">
          ${known.map(k=>`<div class="known-item"><div class="av">👤</div><div class="nm">${esc(k.name||'Sem nome')}</div><button class="go" data-open-known="${k.token}">Abrir</button><button class="go" style="color:var(--crimson-bright);border-color:var(--crimson-bright);" data-forget-known="${k.token}">✕</button></div>`).join('')}
        </div>
        <div class="divider-text">ou</div>
      `:''}
      <button class="big-btn" id="btnCreate">⛩ Criar minha ficha</button>
      <button class="ghost-btn" id="btnHaveLink">Já tenho um link e PIN</button>
    </div>
  </div>`;
  document.getElementById('btnCreate').onclick=()=>{ authError=''; screen='create'; renderAll(); };
  document.getElementById('btnHaveLink').onclick=()=>{ authError=''; screen='pin'; pendingDocPreview=null; currentToken=null; renderAll(); };
  root.querySelectorAll('[data-open-known]').forEach(b=>b.onclick=()=>{
    const token=b.dataset.openKnown; setUrlToken(token); location.reload();
  });
  root.querySelectorAll('[data-forget-known]').forEach(b=>b.onclick=()=>{
    forgetChar(b.dataset.forgetKnown); renderLanding();
  });
}

function renderCreateScreen(){
  root.innerHTML = `<div class="splash">
    ${splashHeader()}
    <div class="splash-card">
      <h2>Criar minha ficha</h2>
      <div class="sub">Escolha um nome. Vamos gerar um link e um PIN exclusivos — só quem tiver os dois consegue ver ou editar essa ficha.</div>
      ${authError?`<div class="splash-error">${esc(authError)}</div>`:''}
      <div class="splash-field"><label>Nome do personagem</label><input id="createName" placeholder="ex: Hayato" style="text-align:left;letter-spacing:normal;"></div>
      <button class="big-btn" id="btnDoCreate">Criar ficha</button>
      <button class="ghost-btn" id="btnBackLanding">Voltar</button>
    </div>
  </div>`;
  document.getElementById('btnBackLanding').onclick=()=>{ screen='landing'; renderAll(); };
  document.getElementById('btnDoCreate').onclick=async ()=>{
    const name = document.getElementById('createName').value.trim() || 'Novo Aventureiro';
    const btn = document.getElementById('btnDoCreate'); btn.textContent='Criando...'; btn.disabled=true;
    try{
      const token = randomToken();
      const pin = randomPin();
      const st = defaultState(); st.name = name;
      await createCharDoc(token, pin, st);
      setCache(token, st);
      rememberChar(token, name, pin, true);
      currentToken=token; currentPin=pin; state=st;
      setUrlToken(token);
      revealInfo = {token, pin, link: shareLink(token)};
      screen='reveal'; renderAll();
    }catch(e){
      console.error(e);
      let details = '';
      try{ details = e && (e.code || e.name) ? (e.code||e.name) : ''; if(e && e.message) details += (details?' — ':'')+e.message; if(!details) details = JSON.stringify(e, Object.getOwnPropertyNames(e||{})); }catch(_){ details = String(e); }
      authError='Erro ao criar: '+details;
      screen='create'; renderAll();
    }
  };
}

function renderRevealScreen(){
  root.innerHTML = `<div class="splash">
    ${splashHeader()}
    <div class="splash-card">
      <h2>Guarde este link e PIN</h2>
      <div class="sub">É a única vez que mostramos os dois juntos. Sem eles, ninguém — nem você — reabre essa ficha depois.</div>
      <div class="reveal-box">
        <div class="lk">Seu link</div>
        <div class="lv" id="revealLink">${esc(revealInfo.link)}</div>
        <button class="copy-btn" id="copyLink">Copiar link</button>
      </div>
      <div class="reveal-box">
        <div class="lk">Seu PIN</div>
        <div class="pv">${revealInfo.pin}</div>

function renderPinScreen(){
  root.innerHTML = `<div class="splash">
    ${splashHeader()}
    <div class="splash-card">
      <h2>${pendingDocPreview?('Ficha de '+esc(pendingDocPreview.name)):'Entrar com link'}</h2>
      <div class="sub">${pendingDocPreview?'Digite o PIN de 4 dígitos dessa ficha.':'Cole o link que você recebeu (ou só o código depois de "?f=").'}</div>
      ${authError?`<div class="splash-error">${esc(authError)}</div>`:''}
      ${!pendingDocPreview?`<div class="splash-field"><input id="linkInput" placeholder="cole o link aqui" style="text-align:left;letter-spacing:normal;"></div>`:''}
      <div class="pin-boxes">
        ${[0,1,2,3].map(i=>`<input type="tel" maxlength="1" class="pinDigit" data-i="${i}">`).join('')}
      </div>
      <div class="remember-row"><input type="checkbox" id="rememberChk" checked> Lembrar PIN neste navegador</div>
      <button class="big-btn" id="btnUnlock">${pendingDocPreview?'Entrar':'Buscar ficha'}</button>
      <button class="ghost-btn" id="btnBackLanding2">Voltar</button>
    </div>
  </div>`;
  document.getElementById('btnBackLanding2').onclick=()=>{ authError=''; screen='landing'; currentToken=null; pendingDocPreview=null; setUrlToken(null); renderAll(); };
  const digits = [...root.querySelectorAll('.pinDigit')];
  digits.forEach((d,i)=>{
    d.addEventListener('input',()=>{ d.value=d.value.replace(/\D/g,''); if(d.value && digits[i+1]) digits[i+1].focus(); });
    d.addEventListener('keydown',(e)=>{ if(e.key==='Backspace' && !d.value && digits[i-1]) digits[i-1].focus(); });
  });
  if(digits[0]) digits[0].focus();

  document.getElementById('btnUnlock').onclick=async ()=>{
    authError='';
    let token = currentToken;
    if(!pendingDocPreview){
      const raw = document.getElementById('linkInput').value.trim();
      const m = raw.match(/[?&]f=([^&]+)/);
      token = m ? decodeURIComponent(m[1]) : raw;
      if(!token){ authError='Cole um link válido.'; renderPinScreen(); return; }
    }
    const pin = digits.map(d=>d.value).join('');
    if(pin.length!==4){ authError='Digite os 4 dígitos do PIN.'; renderPinScreen(); return; }
    const btn = document.getElementById('btnUnlock'); btn.textContent='Verificando...'; btn.disabled=true;
    try{
      const doc_ = await fetchCharDoc(token);
      if(!doc_){ authError='Ficha não encontrada. Confira o link.'; screen='pin'; pendingDocPreview=null; renderAll(); return; }
      const hash = await sha256(pin+':'+token);
      if(hash!==doc_.pinHash){ authError='PIN incorreto.'; screen='pin'; pendingDocPreview={name:doc_.name}; currentToken=token; renderAll(); return; }
      currentToken=token; currentPin=pin;
      state = {...defaultState(), ...JSON.parse(doc_.data)};
      setCache(token,state);
      const remember = document.getElementById('rememberChk')?document.getElementById('rememberChk').checked:true;
      rememberChar(token, state.name, pin, remember);
      setUrlToken(token);
      screen='app'; renderAll();
    }catch(e){ console.error(e); authError='Erro: '+(e.code||e.message||e); screen='pin'; renderAll(); }
  };
}

let saveTimer=null;
function scheduleSave(){ syncStatus='busy'; updateSyncDot(); clearTimeout(saveTimer); saveTimer=setTimeout(doSave,600); }
async function doSave(){
  setCache(currentToken, state);
  touchKnownName(currentToken, state.name);
  try{ await saveCharDoc(currentToken, currentPin, state); syncStatus='ok'; toast('Ficha salva'); }
  catch(e){ console.error(e); syncStatus='err'; toast('Salvo localmente (sem conexão)'); }
  updateSyncDot();
}
function updateSyncDot(){ const el=document.getElementById('syncDot'); if(el){ el.className='sync-dot '+(syncStatus==='busy'?'busy':syncStatus==='ok'?'ok':''); } }
function toast(msg){ const el=document.getElementById('saveToast'); el.textContent=msg; el.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('show'),1400); }

    }).join('')}</div>
  </div>`;
}

function esc2(s){return esc(s);}

/* ===================== BINDING ===================== */
function bindSection(){
  const c = document.getElementById('sections');
  const map = { fName:'name', fTitle:'title', fClan:'clan', fPlayer:'player', fOrigin:'origin',
    fAlign:'alignment', fAge:'age', fHeight:'height', fRace:'race',
    hpCur:'hpCur', hpMax:'hpMax', sanCur:'sanCur', sanMax:'sanMax', corCur:'corCur', corMax:'corMax',
    notesArea:'notes', paMaxInput:'paMax', atkBonusInput:'atkBonus', armorBonusInput:'armorBonus' };
  Object.keys(map).forEach(id=>{
    const el = document.getElementById(id); if(!el) return;
    el.addEventListener('input', ()=>{ let v=el.value; if(el.type==='number') v=v===''?null:parseFloat(v);
      state[map[id]]=v; if(id==='paMax') state.pa=Math.min(state.pa,state.paMax); scheduleSave();
      if(['hpCur','hpMax','sanCur','sanMax'].includes(id)) updateGlance(); });
  });
  const pIn = document.getElementById('portraitInput');
  if(pIn) pIn.addEventListener('change', e=>{ const file=e.target.files[0]; if(!file) return;
    const reader=new FileReader(); reader.onload=()=>{ state.portrait=reader.result; scheduleSave(); renderSection(); }; reader.readAsDataURL(file); });
  const xpPlus=document.getElementById('xpPlus'), xpMinus=document.getElementById('xpMinus');
  if(xpPlus) xpPlus.onclick=()=>addXp(50); if(xpMinus) xpMinus.onclick=()=>addXp(-50);
  c.querySelectorAll('[data-attr-inc]').forEach(b=>b.onclick=()=>{ state.attrs[b.dataset.attrInc]++; scheduleSave(); renderSection(); });
  c.querySelectorAll('[data-attr-dec]').forEach(b=>b.onclick=()=>{ state.attrs[b.dataset.attrDec]=Math.max(1,state.attrs[b.dataset.attrDec]-1); scheduleSave(); renderSection(); });
  c.querySelectorAll('[data-attr]').forEach(inp=>inp.addEventListener('change',()=>{ state.attrs[inp.dataset.attr]=parseInt(inp.value)||10; scheduleSave(); renderSection(); }));
  c.querySelectorAll('[data-skill-inc]').forEach(b=>b.onclick=()=>{ const k=b.dataset.skillInc; state.skills[k]=clamp((state.skills[k]||0)+1,-2,5); scheduleSave(); renderSection(); });
  c.querySelectorAll('[data-skill-dec]').forEach(b=>b.onclick=()=>{ const k=b.dataset.skillDec; state.skills[k]=clamp((state.skills[k]||0)-1,-2,5); scheduleSave(); renderSection(); });
  c.querySelectorAll('[data-pa]').forEach(p=>p.onclick=()=>{ const i=parseInt(p.dataset.pa); state.pa=(state.pa===i+1)?i:i+1; scheduleSave(); renderSection(); });
  const resetTurn=document.getElementById('resetTurn'); if(resetTurn) resetTurn.onclick=()=>{ state.pa=state.paMax; state.reaction=true; scheduleSave(); renderSection(); };
  const toggleReaction=document.getElementById('toggleReaction'); if(toggleReaction) toggleReaction.onclick=()=>{ state.reaction=!state.reaction; scheduleSave(); renderSection(); };
  c.querySelectorAll('[data-cond]').forEach(chk=>chk.addEventListener('change',()=>{ const k=chk.dataset.cond; state.conditions[k]=state.conditions[k]||{active:false,rounds:1}; state.conditions[k].active=chk.checked; scheduleSave(); renderSection(); }));
  c.querySelectorAll('[data-cond-rounds]').forEach(inp=>inp.addEventListener('input',()=>{ const k=inp.dataset.condRounds; state.conditions[k]=state.conditions[k]||{active:false,rounds:1}; state.conditions[k].rounds=parseInt(inp.value)||0; scheduleSave(); }));
  c.querySelectorAll('[data-destiny]').forEach(p=>p.onclick=()=>{ const i=parseInt(p.dataset.destiny); state.destinyCur=(state.destinyCur===i+1)?i:i+1; scheduleSave(); renderSection(); });
  c.querySelectorAll('[data-spirit]').forEach(p=>p.onclick=()=>{ const i=parseInt(p.dataset.spirit); state.spiritCur=(state.spiritCur===i+1)?i:i+1; scheduleSave(); renderSection(); });
  c.querySelectorAll('[data-death]').forEach(p=>p.onclick=()=>{ const i=parseInt(p.dataset.death); state.deathMarks=(state.deathMarks===i+1)?i:i+1; scheduleSave(); renderSection(); });
  c.querySelectorAll('[data-roll]').forEach(b=>b.onclick=()=>{ const mod=parseInt(b.dataset.mod); const d20=Math.floor(Math.random()*20)+1; const total=d20+mod;
    const target=document.getElementById('rr-'+b.dataset.roll); if(target) target.textContent=`🎲 ${d20} ${fmtMod(mod)} = ${total}${d20===20?' ✨CRÍTICO!':''}${d20===1?' 💀FALHA!':''}`; });
  c.querySelectorAll('[data-equip]').forEach(b=>b.onclick=()=>{ const id=b.dataset.equip; state.weapons.forEach(w=>w.equipped = w.id===id ? !w.equipped : false); scheduleSave(); renderSection(); });
  c.querySelectorAll('[data-weapon-qty]').forEach(inp=>inp.addEventListener('input',()=>{ const w=state.weapons.find(w=>w.id===inp.dataset.weaponQty); if(w){ w.qty=parseInt(inp.value)||1; scheduleSave(); } }));
  c.querySelectorAll('[data-del-weapon]').forEach(b=>b.onclick=()=>{ state.weapons=state.weapons.filter(w=>w.id!==b.dataset.delWeapon); scheduleSave(); renderSection(); });
  const addWeaponBtn=document.getElementById('addWeaponBtn'); if(addWeaponBtn) addWeaponBtn.onclick=()=>{ const sel=document.getElementById('newWeaponSelect'); const wc=WEAPONS_CATALOG.find(w=>w.n===sel.value); state.weapons.push({id:cid(),name:wc.n,dice:wc.dice,attr:wc.a,qty:1,equipped:false}); scheduleSave(); renderSection(); };
  c.querySelectorAll('[data-item-qty]').forEach(inp=>inp.addEventListener('input',()=>{ const it=state.items.find(i=>i.id===inp.dataset.itemQty); if(it){ it.qty=parseInt(inp.value)||1; scheduleSave(); } }));
  c.querySelectorAll('[data-del-item]').forEach(b=>b.onclick=()=>{ state.items=state.items.filter(i=>i.id!==b.dataset.delItem); scheduleSave(); renderSection(); });
  const addItemBtn=document.getElementById('addItemBtn'); if(addItemBtn) addItemBtn.onclick=()=>{ const inp=document.getElementById('newItemName'); const name=inp.value.trim(); if(!name) return; const icon=ITEM_ICONS[name]||'📦'; state.items.push({id:cid(),name,qty:1,weight:0.3,icon}); inp.value=''; scheduleSave(); renderSection(); };
  c.querySelectorAll('[data-own]').forEach(b=>b.onclick=()=>{ const k=b.dataset.own; state.talismansOwned[k]=!state.talismansOwned[k]; if(!state.talismansOwned[k]) state.talismansActive=state.talismansActive.filter(x=>x!==k); scheduleSave(); renderSection(); });
  c.querySelectorAll('[data-active]').forEach(b=>b.onclick=()=>{ const k=b.dataset.active; if(state.talismansActive.includes(k)) state.talismansActive=state.talismansActive.filter(x=>x!==k); else if(state.talismansActive.length<3) state.talismansActive.push(k); scheduleSave(); renderSection(); });
  c.querySelectorAll('[data-class]').forEach(b=>b.onclick=()=>{ state.classKey = state.classKey===b.dataset.class ? null : b.dataset.class; scheduleSave(); renderSection(); });
  c.querySelectorAll('[data-story-title]').forEach(inp=>inp.addEventListener('input',()=>{ const s=state.stories.find(s=>s.id===inp.dataset.storyTitle); if(s){ s.title=inp.value; scheduleSave(); } }));
  c.querySelectorAll('[data-story-effect]').forEach(inp=>inp.addEventListener('input',()=>{ const s=state.stories.find(s=>s.id===inp.dataset.storyEffect); if(s){ s.effectText=inp.value; scheduleSave(); } }));
  c.querySelectorAll('[data-story-attr]').forEach(sel=>sel.addEventListener('change',()=>{ const s=state.stories.find(s=>s.id===sel.dataset.storyAttr); if(s){ s.attrKey=sel.value||null; scheduleSave(); renderSection(); } }));
  c.querySelectorAll('[data-story-amount]').forEach(inp=>inp.addEventListener('input',()=>{ const s=state.stories.find(s=>s.id===inp.dataset.storyAmount); if(s){ s.attrAmount=parseInt(inp.value)||0; scheduleSave(); } }));
  c.querySelectorAll('[data-story-gain]').forEach(inp=>inp.addEventListener('input',()=>{ const s=state.stories.find(s=>s.id===inp.dataset.storyGain); if(s){ s.gain=inp.value; scheduleSave(); } }));
  c.querySelectorAll('[data-story-toggle]').forEach(b=>b.onclick=()=>{ const id=b.dataset.storyToggle; const target=state.stories.find(s=>s.id===id); const willActivate=!target.active; state.stories.forEach(s=>s.active=false); if(willActivate) target.active=true; scheduleSave(); renderSection(); });
  const copyShareLink=document.getElementById('copyShareLink'); if(copyShareLink) copyShareLink.onclick=()=>{ navigator.clipboard.writeText(shareLink(currentToken)); toast('Link copiado'); };
  const revealPinBtn=document.getElementById('revealPinBtn'); if(revealPinBtn) revealPinBtn.onclick=()=>{ if(currentPin) alert('PIN desta ficha: '+currentPin); else alert('PIN não está salvo neste navegador.'); };
  const switchCharBtn=document.getElementById('switchCharBtn'); if(switchCharBtn) switchCharBtn.onclick=()=>{ screen='landing'; setUrlToken(null); authError=''; renderAll(); };
  const forgetHereBtn=document.getElementById('forgetHereBtn'); if(forgetHereBtn) forgetHereBtn.onclick=()=>{ if(confirm('Esquecer o PIN salvo deste personagem neste navegador?')){ forgetChar(currentToken); toast('Esquecido neste dispositivo'); } };
}

function addXp(n){
  state.xp += n;
  while(state.xp >= state.xpMax){ state.xp -= state.xpMax; state.level++; state.xpMax = Math.round(state.xpMax*1.25); }
  while(state.xp < 0 && state.level>1){ state.level--; state.xpMax = Math.round(state.xpMax/1.25); state.xp += state.xpMax; }
  if(state.xp<0) state.xp=0;
  scheduleSave(); renderSection();
}

window.addEventListener('click', (e)=>{
  if(screen==='app' && window.innerWidth<=760 && sidebarOpen && !e.target.closest('.sidebar') && !e.target.closest('#menuToggle')){
    sidebarOpen=false; renderShell();
  }
});

boot();
</script>
